name: AgroSmart DevSecOps Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  devsecops-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Ferramentas de Qualidade e Segurança
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit pip-audit

      - name: 1. Qualidade de Código (Flake8)
        run: flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: 2. Análise Estática de Segurança - SAST (Bandit)
        run: bandit -r src/ -ll || true

      - name: 3. Auditoria de Dependências (pip-audit)
        run: |
          tr -d '\r\000' < requirements.txt | sed '1s/^\xEF\xBB\xBF//' > req-clean.txt
          pip-audit -r req-clean.txt || true

      - name: 4. Build da Imagem Docker
        run: docker build -t agrosmart-core:ci .

      - name: 5. Auditoria de Vulnerabilidades do Container (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'agrosmart-core:ci'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: 6. Smoke Test (Validação Docker Compose)
        run: |
          docker compose config -q
          docker compose up -d
          sleep 10
          docker compose ps
          docker compose down